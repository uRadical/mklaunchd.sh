<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mklaunchd og | uRadical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sen:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg:        #FBFBFD;
    --bg-warm:   #F2EEE6;
    --navy:      #0C1A50;
    --sky:       #5DB1FF;
    --purple:    #9F72E1;
    --pink:      #F659A8;
    --gold:      #E1C631;
    --ink:       var(--navy);
    --ink-dim:   rgba(12, 26, 80, 0.72);
    --ink-faint: rgba(12, 26, 80, 0.50);
    --code-bg:   #0A1240;
    --code-fg:   #E5EAFF;
    --serif:     "Sen", -apple-system, sans-serif;
    --mono:      ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-warm) 100%);
    font-family: var(--serif);
    color: var(--ink);
    position: relative;
}

/* Hero halo — same gradient as the site hero, tuned for OG */
body::before {
    content: "";
    position: absolute;
    inset: -10% -10% auto auto;
    width: 900px;
    height: 720px;
    background: radial-gradient(
        ellipse at 70% 30%,
        rgba(93, 177, 255, 0.45) 0%,
        rgba(159, 114, 225, 0.30) 22%,
        rgba(246, 89, 168, 0.22) 42%,
        rgba(225, 198, 49, 0.12) 60%,
        transparent 78%
    );
    filter: blur(40px);
    opacity: 0.80;
    pointer-events: none;
    z-index: 0;
}

.stripe {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(
        90deg,
        var(--sky) 0%,
        var(--purple) 35%,
        var(--pink) 70%,
        var(--gold) 100%
    );
    z-index: 2;
}

.layout {
    position: absolute;
    inset: 60px 70px 60px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    z-index: 1;
}

/* Terminal — dark surface, same as site hero */
.term {
    position: relative;
    background: var(--code-bg);
    border-radius: 18px;
    box-shadow:
        0 30px 80px -20px rgba(12, 26, 80, 0.30),
        0 0 0 1px rgba(12, 26, 80, 0.08);
    padding: 36px 38px 40px;
}
.term pre {
    font-family: var(--mono);
    font-size: 19px;
    line-height: 1.65;
    white-space: pre;
    color: var(--code-fg);
}
.term .prompt { color: var(--purple); }
.term .cmd    { color: var(--code-fg); font-weight: 600; }
.term .flag   { color: var(--sky); }
.term .arg    { color: var(--gold); }
.term .ok     { color: #4ADE80; }
.term .cursor {
    display: inline-block;
    width: 11px; height: 22px;
    background: linear-gradient(180deg, var(--sky), var(--purple), var(--pink), var(--gold));
    vertical-align: -4px;
    border-radius: 1px;
}

/* Right column */
.right {
    padding-right: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.logo {
    height: 96px;
    width: auto;
    margin-bottom: 18px;
    filter: drop-shadow(0 10px 24px rgba(12, 26, 80, 0.14));
}

.wordmark {
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 22px;
}

.tagline {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 26px;
}
.tagline .grad {
    background: linear-gradient(
        92deg,
        var(--sky) 0%,
        var(--purple) 40%,
        var(--pink) 75%,
        var(--gold) 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
}

.pills {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
}
.pill {
    padding: 9px 16px;
    border-radius: 999px;
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.005em;
    color: #fff;
}
.pill.a { background: #5DB1FF; }
.pill.b { background: #9F72E1; }
.pill.c { background: #F659A8; }

.url {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--ink-dim);
    letter-spacing: -0.01em;
}

.attr {
    position: absolute;
    bottom: 32px;
    right: 50px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.85;
    z-index: 2;
}
.attr img {
    height: 28px;
    width: auto;
    display: block;
}
</style>
</head>
<body>

<div class="stripe"></div>

<div class="layout">

    <div class="term">
<pre><span class="prompt">$</span> <span class="cmd">mklaunchd generate</span> \
  <span class="flag">--label</span> <span class="arg">io.uradical.myapp</span> \
  <span class="flag">--binary</span> <span class="arg">/usr/local/bin/myapp</span> \
  <span class="flag">--write</span> <span class="flag">--yes</span>

<span class="ok">✓</span> Validation passed
<span class="ok">✓</span> Plist written to ~/Library/LaunchAgents/

<span class="prompt">$</span> <span class="cursor"></span></pre>
    </div>

    <div class="right">
        <img src="logo.png" alt="" class="logo">
        <div class="wordmark">mklaunchd</div>
        <div class="tagline">
            launchd plists,<br>
            <span class="grad">without the friction.</span>
        </div>
        <div class="pills">
            <span class="pill a">Interactive</span>
            <span class="pill b">Scriptable</span>
            <span class="pill c">Validating</span>
        </div>
        <div class="url">mklaunchd.sh</div>
    </div>

</div>

<div class="attr">
    <img src="uradical.png" alt="uRadical">
</div>

</body>
</html>
